<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Онлайн-комиксы - Вход и регистрация</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
</head>
<body>

  <header>
    <a href="index.html" class="logo">
      <i class="fa-solid fa-book-open"></i>
      Онлайн-комиксы
    </a>
    <div class="search-bar">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" placeholder="Поиск комиксов, авторов...">
    </div>
    <div class="auth-buttons" id="authButtons"></div>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2 id="authTitle">С возвращением!</h2>
        <p id="authSubtitle">Войдите, чтобы продолжить чтение и создание комиксов</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab('login')">Вход</button>
        <button class="auth-tab" onclick="switchTab('register')">Регистрация</button>
      </div>

      <div class="form-error" id="authError"></div>

      <form class="auth-form active" id="form-login">
        <div class="input-icon">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" class="form-control" id="loginEmail" placeholder="Email" required>
        </div>
        <div class="input-icon">
          <i class="fa-solid fa-lock"></i>
          <input type="password" class="form-control" id="loginPassword" placeholder="Пароль" required>
        </div>
        <a href="#" class="forgot-password">Забыли пароль?</a>
        <button type="submit" class="btn btn-primary btn-block">Войти</button>
        <div class="divider">или</div>
        <div class="social-buttons">
          <button type="button" class="social-btn"><i class="fa-brands fa-google"></i> Google</button>
          <button type="button" class="social-btn"><i class="fa-brands fa-vk"></i> VK</button>
        </div>
        <div class="auth-footer">
          Нет аккаунта? <a href="#" onclick="switchTab('register'); return false;">Зарегистрируйтесь</a>
        </div>
      </form>

      <form class="auth-form" id="form-register">
        <div class="input-icon">
          <i class="fa-regular fa-user"></i>
          <input type="text" class="form-control" id="regName" placeholder="Имя пользователя" required>
        </div>
        <div class="input-icon">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" class="form-control" id="regEmail" placeholder="Email" required>
        </div>
        <div class="input-icon">
          <i class="fa-solid fa-lock"></i>
          <input type="password" class="form-control" id="regPassword" placeholder="Пароль (минимум 6 символов)" required>
        </div>
        <div class="input-icon">
          <i class="fa-solid fa-lock"></i>
          <input type="password" class="form-control" id="regPassword2" placeholder="Повторите пароль" required>
        </div>
        <label class="checkbox-wrapper">
          <input type="checkbox" id="regAgree" required>
          <span>Я принимаю <a href="rules.html">правила платформы</a> и <a href="#">политику конфиденциальности</a></span>
        </label>
        <button type="submit" class="btn btn-primary btn-block">Создать аккаунт</button>
        <div class="auth-footer">
          Уже есть аккаунт? <a href="#" onclick="switchTab('login'); return false;">Войдите</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    // === ШАПКА ===
    function renderAuthButtons() {
      const container = document.getElementById('authButtons');
      if (!container) return;
      const current = JSON.parse(localStorage.getItem('currentUser') || 'null');
      if (current) {
        const initials = current.name.slice(0, 1).toUpperCase();
        container.innerHTML = `
          <div class="user-menu">
            <a href="profile.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-main);">
              <div class="user-avatar">${initials}</div>
              <span class="user-name">${current.name}</span>
            </a>
            <button class="btn-logout" onclick="logoutUser()">Выйти</button>
          </div>
        `;
      } else {
        container.innerHTML = `
          <a href="auth.html" class="btn-login">Войти</a>
          <a href="auth.html" class="btn-register">Регистрация</a>
        `;
      }
    }
    function logoutUser() {
      localStorage.removeItem('currentUser');
      window.location.href = 'index.html';
    }
    renderAuthButtons();

    // === ВКЛАДКИ ===
    function switchTab(tab) {
      const tabs = document.querySelectorAll('.auth-tab');
      const forms = document.querySelectorAll('.auth-form');
      const title = document.getElementById('authTitle');
      const subtitle = document.getElementById('authSubtitle');
      const error = document.getElementById('authError');
      error.classList.remove('visible');

      tabs.forEach(t => t.classList.remove('active'));
      forms.forEach(f => f.classList.remove('active'));

      if (tab === 'login') {
        tabs[0].classList.add('active');
        document.getElementById('form-login').classList.add('active');
        title.textContent = 'С возвращением!';
        subtitle.textContent = 'Войдите, чтобы продолжить чтение и создание комиксов';
      } else {
        tabs[1].classList.add('active');
        document.getElementById('form-register').classList.add('active');
        title.textContent = 'Создайте аккаунт';
        subtitle.textContent = 'Присоединяйтесь к сообществу авторов и читателей';
      }
    }

    function showError(msg) {
      const error = document.getElementById('authError');
      error.textContent = msg;
      error.classList.add('visible');
    }

    function getUsers() {
      return JSON.parse(localStorage.getItem('users') || '[]');
    }

    function saveUsers(users) {
      localStorage.setItem('users', JSON.stringify(users));
    }

    // === РЕГИСТРАЦИЯ ===
    document.getElementById('form-register').addEventListener('submit', (e) => {
      e.preventDefault();

      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim().toLowerCase();
      const password = document.getElementById('regPassword').value;
      const password2 = document.getElementById('regPassword2').value;
      const agree = document.getElementById('regAgree').checked;

      if (name.length < 2) return showError('Имя должно содержать минимум 2 символа');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError('Введите корректный email');
      if (password.length < 6) return showError('Пароль должен быть минимум 6 символов');
      if (password !== password2) return showError('Пароли не совпадают');
      if (!agree) return showError('Необходимо принять правила платформы');

      const users = getUsers();
      if (users.some(u => u.email === email)) {
        return showError('Пользователь с таким email уже существует');
      }

      const newUser = {
        id: 'user_' + Date.now(),
        name: name,
        email: email,
        password: password,
        createdAt: Date.now()
      };

      users.push(newUser);
      saveUsers(users);

      localStorage.setItem('currentUser', JSON.stringify({
        id: newUser.id,
        name: newUser.name,
        email: newUser.email
      }));

      window.location.href = 'index.html';
    });

    // === ВХОД ===
    document.getElementById('form-login').addEventListener('submit', (e) => {
      e.preventDefault();

      const email = document.getElementById('loginEmail').value.trim().toLowerCase();
      const password = document.getElementById('loginPassword').value;

      const users = getUsers();
      const user = users.find(u => u.email === email && u.password === password);

      if (!user) {
        return showError('Неверный email или пароль');
      }

      localStorage.setItem('currentUser', JSON.stringify({
        id: user.id,
        name: user.name,
        email: user.email
      }));

      window.location.href = 'index.html';
    });
  </script>

</body>
</html>
